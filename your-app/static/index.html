<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ガンプラ管理 App</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>ガンプラ管理 App</h1>

        <!-- 入力フォーム -->
        <form id="todo-form">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="ガンプラの名前を入力..." 
                maxlength="100" 
                required
            >
            <button type="submit">追加</button>
        </form>

        <!-- ガンプラ一覧が表示される場所 -->
        <ul id="todo-list"></ul>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
